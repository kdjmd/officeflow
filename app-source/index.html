<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>OfficeFlow</title>
</head>

  <div class="app-shell">
    <header class="titlebar">
      <div class="titlebar__brand">
        <span class="app-mark" data-icon="brand" aria-hidden="true"></span>
        <span class="titlebar__title">OfficeFlow</span>
        <span class="titlebar__divider" aria-hidden="true"></span>
        <span class="titlebar__subtitle">本地办公文件处理</span>
      </div>
      <div class="controls">
        <button type="button" onclick="minimize()" title="最小化" aria-label="最小化" data-icon="minimize"></button>
        <button type="button" onclick="maximize()" title="最大化" aria-label="最大化" data-icon="maximize"></button>
        <button type="button" class="close" onclick="closeWindow()" title="隐藏到后台" aria-label="隐藏到后台" data-icon="close"></button>
      </div>
    </header>
    <div class="container">
      <nav class="sidebar" id="sidebar" aria-label="主导航">
        <span class="nav-indicator" aria-hidden="true"></span>
        <div class="sidebar__group">
          <button type="button" class="nav-item active" data-page="home" onclick="showPage('home')">
            <span class="nav-item__ico" data-icon="home" aria-hidden="true"></span><span class="nav-item__label">工作台</span>
          </button>
          <button type="button" class="nav-item" data-page="upload" onclick="showPage('upload')">
            <span class="nav-item__ico" data-icon="upload" aria-hidden="true"></span><span class="nav-item__label">上传文件</span>
          </button>
          <button type="button" class="nav-item" data-page="outputs" onclick="showPage('outputs')">
            <span class="nav-item__ico" data-icon="folder" aria-hidden="true"></span><span class="nav-item__label">结果文件</span>
          </button>
        </div>
        <div class="nav-sep" role="separator"></div>
        <div class="sidebar__group">
          <button type="button" class="nav-item" data-page="history" onclick="showPage('history')">
            <span class="nav-item__ico" data-icon="clock" aria-hidden="true"></span><span class="nav-item__label">历史记录</span>
          </button>
          <button type="button" class="nav-item" data-page="settings" onclick="showPage('settings')">
            <span class="nav-item__ico" data-icon="settings" aria-hidden="true"></span><span class="nav-item__label">设置</span>
          </button>
        </div>
        <div class="sidebar__spacer"></div>
        <aside class="privacy-card">
          <span class="privacy-card__ico" data-icon="shield" aria-hidden="true"></span>
          <div>
            <strong>本地优先</strong>
            <span>文件默认不离开这台电脑</span>
          </div>
        </aside>
      </nav>
      <main class="content" id="content"></main>
    </div>
  </div>

    function icon(name, className = 'ico') {
      const body = ICONS[name] || ICONS.file;
      return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
    }

    function taskIcon(taskId, className = 'ico') {
      return icon(TASK_ICONS[taskId] || 'file', className);
    }

    function hydrateIcons(root) {
      const scope = root || document;
      if (!scope || typeof scope.querySelectorAll !== 'function') return;
      scope.querySelectorAll('[data-icon]').forEach(element => {
        if (element.dataset && element.dataset.iconReady === '1') return;
        element.innerHTML = icon(element.getAttribute('data-icon'));
        if (element.dataset) element.dataset.iconReady = '1';
      });
    }

    function renderStepper(activeIndex) {
      return `<ol class="stepper" aria-label="处理流程">${FLOW_STEPS.map((step, index) => {
        const state = index === activeIndex ? 'current' : index < activeIndex ? 'done' : 'todo';
        const mark = index < activeIndex ? icon('check') : String(index + 1);
        const label = `<span class="stepper__label">${escapeHtml(step.label)}</span>`;
        if (index < activeIndex && step.page) {
          return `<li class="stepper__item ${state}"><button type="button" class="stepper__btn" onclick="showPage('${step.page}')"><span class="stepper__mark">${mark}</span>${label}</button></li>`;
        }
        return `<li class="stepper__item ${state}"><span class="stepper__mark">${mark}</span>${label}</li>`;
      }).join('')}</ol>`;
    }

    function emptyState(iconName, title, description = '', action = '') {

        <div class="empty-state">
          <span class="empty-state__ico">${icon(iconName)}</span>
          <strong class="empty-state__title">${escapeHtml(title)}</strong>
          ${description ? `<p class="empty-state__desc">${escapeHtml(description)}</p>` : ''}
          ${action ? `<div class="empty-state__action">${action}</div>` : ''}

    function createEmptyTableState() {
      return {
        stage: 'configure',

        schemaProvider: '',
        aiSkipped: false,
        aiSkipReason: '',
        presetMatchedInitially: false,
        aiUsedAfterPresetMatch: false,
        presets: [],
        presetsLoaded: false,

        selectedPresetId: '',
        selectedPresetSchema: null,
        presetNotice: null,
        presetSaveNotice: null,
        exporting: false,
        enhancing: false,
        dirty: false,
        busyOperation: null,
        operationToken: 0,
      };
    }

    function beginTableOperation(operation) {
      if (tableState.busyOperation) return 0;
      const token = ++tableOperationSequence;
      tableState.busyOperation = operation;
      tableState.operationToken = token;
      return token;
    }

    function isTableOperationCurrent(token, operation, stage) {
      return Boolean(token)
        && tableState.operationToken === token
        && tableState.busyOperation === operation
        && currentPage === 'table-workbench'
        && (!stage || tableState.stage === stage);
    }

    function finishTableOperation(token, operation) {
      if (tableState.operationToken !== token || tableState.busyOperation !== operation) return false;
      tableState.busyOperation = null;
      tableState.operationToken = 0;
      tableState.exporting = false;
      tableState.enhancing = false;
      if (operation === 'analyze') isProcessing = false;
      return true;
    }

    function invalidateTableOperation(cancelBackend = false) {
      const hadOperation = Boolean(tableState.busyOperation);
      const jobId = tableState.jobId;
      tableOperationSequence += 1;
      tablePresetRequestSequence += 1;
      tableState.operationToken = 0;
      tableState.busyOperation = null;
      tableState.exporting = false;
      tableState.enhancing = false;
      isProcessing = false;
      if (cancelBackend && (hadOperation || jobId)) {
        ipcRenderer.invoke('table-cancel', { jobId: jobId || '' })
          .catch(error => console.warn('Table cancellation failed:', cleanTableMessage(error)));
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getFileName(filePath) {
      return String(filePath || '').split(/[/\\]/).pop();
    }

    function getFileExt(filePath) {
      const name = getFileName(filePath);
      return name.includes('.') ? name.split('.').pop().toLowerCase() : '';
    }

    function dedupeFiles(files) {
      return [...new Set([...selectedFiles, ...files].filter(Boolean))];
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let size = bytes;
      let unit = 0;
      while (size >= 1024 && unit < units.length - 1) {
        size /= 1024;
        unit += 1;
      }
      return `${size.toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`;
    }

    function formatDate(value) {
      return new Date(value).toLocaleString('zh-CN', { hour12: false });
    }

    function getTask(taskId) {
      return allTasks.find(t => t.id === taskId);
    }

    function getFilteredTasks() {
      if (selectedFiles.length === 0) return allTasks;
      const exts = [...new Set(selectedFiles.map(f => getFileExt(f)))];
      const matched = allTasks.filter(t => t.types.some(type => exts.includes(type)));
      return matched.length > 0 ? matched : [];
    }

    function getExtColor(ext) {
      const map = {
        docx: '#2B579A', doc: '#2B579A',
        xlsx: '#217346', xls: '#217346',
        pdf: '#D13438',
        pptx: '#B7472A', ppt: '#B7472A',
        png: '#0078D4', jpg: '#0078D4', jpeg: '#0078D4', bmp: '#0078D4',
        tiff: '#0078D4', webp: '#0078D4',
        csv: '#217346', txt: '#5B6470', md: '#5B6470',
      };
      return map[ext] || '#6B7177';
    }

    function getExtIcon(ext) {
      const map = {
        docx: 'file', doc: 'file',
        xlsx: 'table', xls: 'table', csv: 'table',
        pdf: 'toPdf',
        pptx: 'imageStack', ppt: 'imageStack',
        txt: 'textOut', md: 'textOut',
      };
      return map[ext] || 'image';
    }

    // 徽标文字用的加深色：原类型色在白底上对比度不足 4.5:1（如 PDF 红仅 4.11），
    // 这里使用同色系加深版本，保证小字号文字达到 AA。
    function getExtInk(ext) {
      const map = {
        docx: '#24487F', doc: '#24487F',
        xlsx: '#186040', xls: '#186040', csv: '#186040',
        pdf: '#A4262C',
        pptx: '#9A3A22', ppt: '#9A3A22',
        png: '#0F6CBD', jpg: '#0F6CBD', jpeg: '#0F6CBD', bmp: '#0F6CBD',
        tiff: '#0F6CBD', webp: '#0F6CBD',
        txt: '#4A5056', md: '#4A5056',
      };
      return map[ext] || '#4A5056';
    }

    function minimize() { ipcRenderer.send('window-minimize'); }
    function maximize() { ipcRenderer.send('window-maximize'); }
    function closeWindow() { ipcRenderer.send('window-close'); }

    /* 流程顺序，用来判断页面是「往前走」还是「往回退」。
       侧栏独立页面（结果文件 / 历史记录 / 设置）不在流程里，标记为 lateral。 */
    const PAGE_RANK = {
      home: 0, upload: 1, tasks: 2, 'table-workbench': 3, processing: 4, result: 5,
    };

    function pageDirection(from, to) {
      if (!from || from === to) return '';
      const a = PAGE_RANK[from];
      const b = PAGE_RANK[to];
      if (a === undefined || b === undefined) return 'lateral';
      return b > a ? 'forward' : 'back';
    }

    /* 进度条只推 transform，不再改 width（改宽度会让浏览器每帧重排）。
       见 style.css 的 .progress-fill —— 它读的是 --p（0~1）。 */
    function setProgressFill(fill, percent) {
      if (!fill) return;
      const p = Math.max(0, Math.min(100, Number(percent) || 0));
      fill.style.setProperty('--p', String(p / 100));
    }

    function setActiveNav(page) {
      document.querySelectorAll('.nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
      });
      moveNavIndicator();
    }

    function moveNavIndicator() {
      const nav = document.getElementById('sidebar');
      const indicator = nav ? nav.querySelector('.nav-indicator') : null;
      if (!indicator) return;
      const active = nav.querySelector('.nav-item.active');
      if (!active) {
        indicator.classList.remove('is-ready');
        return;
      }
      const navTop = nav.getBoundingClientRect().top;
      const itemTop = active.getBoundingClientRect().top;
      const y = itemTop - navTop + (active.offsetHeight - indicator.offsetHeight) / 2;
      if (indicator.dataset.placed !== '1') {
        /* 首次定位不播动画：否则启动时指示条会从侧栏顶端滑下来 */
        indicator.style.transition = 'none';
        indicator.style.setProperty('--nav-y', `${y}px`);
        indicator.classList.add('is-ready');
        void indicator.offsetHeight;
        indicator.style.transition = '';
        indicator.dataset.placed = '1';
        return;
      }
      indicator.style.setProperty('--nav-y', `${y}px`);
      indicator.classList.add('is-ready');
    }

    function showPage(page, data) {
      if (currentPage === 'table-workbench' && page !== 'table-workbench') {
        invalidateTableOperation(true);
      }
      const direction = pageDirection(currentPage, page);
      currentPage = page;
      setActiveNav(page);
      const content = document.getElementById('content');
      /* 写在容器上供 CSS 选择：forward / back / lateral / ''（同页重渲染不转场） */
      content.dataset.nav = direction;
      if (page === 'home') renderHome(content);
      else if (page === 'upload') renderUpload(content);
      else if (page === 'tasks') renderTasks(content);
      else if (page === 'table-workbench') renderTableWorkbench(content);
      else if (page === 'processing') renderProcessing(content);
      else if (page === 'result') renderResult(content, data || latestResult);
      else if (page === 'outputs') renderOutputs(content);
      else if (page === 'history') renderHistory(content);
      else if (page === 'settings') renderSettings(content);
    }

    function setupDragDrop() {
      const dropZone = document.getElementById('dropZone');
      if (!dropZone) return;

      ['dragenter', 'dragover'].forEach(evt => {
        dropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.add('drag-over');
        });
      });

      ['dragleave', 'drop'].forEach(evt => {
        dropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropZone.classList.remove('drag-over');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        const files = Array.from(e.dataTransfer.files).map((file) => {
          if (webUtils?.getPathForFile) return webUtils.getPathForFile(file);
          return file.path;
        });
        if (files.length > 0) {
          selectedFiles = dedupeFiles(files);
          selectedTask = null;
          showPage('upload');
        }
      });
    }

    function activateDropZone(event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      selectFiles();
    }

      selectedFiles = [];
      selectedTask = null;

    function doProcess() {

        tableState = createEmptyTableState();
        showPage('table-workbench');
        loadTablePresets();
        return;
      }
      isProcessing = true;
      renderProcessing(document.getElementById('content'));
      runProgress();

      ipcRenderer.invoke('cancel-task');

    function getTableInputFiles() {
      const supported = new Set(['doc', 'docx', 'pdf', 'txt', 'md']);
      return selectedFiles.filter(filePath => supported.has(getFileExt(filePath)));
    }

    function setTableMode(mode) {
      const previousMode = tableState.mode;
      const nextMode = ['auto', 'existing', 'custom', 'smart'].includes(mode) ? mode : 'auto';
      if (nextMode === 'smart' && previousMode !== 'smart') {
        tableState.useAiBeforeSmart = tableState.useAi;
        tableState.useAi = true;
      } else if (previousMode === 'smart' && nextMode !== 'smart') {
        tableState.useAi = tableState.useAiBeforeSmart;
      }
      tableState.mode = nextMode;
      renderTableWorkbench(document.getElementById('content'));
      document.querySelector(`input[name="tableMode"][value="${tableState.mode}"]`)?.focus();
      if (tableState.mode === 'smart' && !tableState.presetsLoaded && !tableState.presetsLoading) {
        loadTablePresets();
      }
    }

    function updateTableFields(value) {
      tableState.customFields = String(value || '').slice(0, 500);
      const button = document.getElementById('tableAnalyzeBtn');
      if (button) button.disabled = (tableState.mode === 'custom' && parseTableFields().length === 0)
        || (tableState.mode === 'smart' && !tableState.tableGoal.trim());
    }

    function updateTableGoal(value) {
      tableState.tableGoal = String(value || '').slice(0, 500);
      const button = document.getElementById('tableAnalyzeBtn');
      if (button) button.disabled = !tableState.tableGoal.trim();
    }

    function applySmartGoalSuggestion(index) {
      const suggestion = studentTableGoals[Number(index)];
      if (!suggestion || tableState.busyOperation || tableState.stage !== 'configure') return;
      tableState.tableGoal = suggestion.goal.slice(0, 500);
      renderTableWorkbench(document.getElementById('content'));
      const goalInput = document.getElementById('tableGoal');
      goalInput?.focus();
      goalInput?.setSelectionRange?.(goalInput.value.length, goalInput.value.length);
    }

    function parseTableFields() {
      const selectedSchema = tableState.mode === 'smart' ? normalizeTablePresetSchema(tableState.selectedPresetSchema) : null;
      if (selectedSchema) return selectedSchema.fields.map(field => field.label).slice(0, 30);
      return [...new Set(tableState.customFields
        .split(/[，,、;；\n]/)
        .map(field => field.trim())
        .filter(Boolean))]
        .slice(0, 30);
    }

    function normalizeTablePresetSchema(schema) {
      if (!schema || typeof schema !== 'object' || Array.isArray(schema)) return null;
      const seen = new Set();
      const fields = (Array.isArray(schema.fields) ? schema.fields : []).slice(0, 30).map((field, index) => {
        const source = field && typeof field === 'object' && !Array.isArray(field) ? field : {};
        const label = cleanTableMessage(typeof field === 'string' ? field : (source.label || source.name || source.key), `字段 ${index + 1}`).slice(0, 100).trim();
        const normalizedLabel = label.toLocaleLowerCase();
        if (!label || seen.has(normalizedLabel)) return null;
        seen.add(normalizedLabel);
        const key = cleanTableMessage(source.key || source.id || label, label).slice(0, 100);
        return {
          key,
          label,
          aliases: (Array.isArray(source.aliases) ? source.aliases : []).slice(0, 10).map(alias => cleanTableMessage(alias).slice(0, 100)).filter(Boolean),
          description: cleanTableMessage(source.description || '', '').slice(0, 300),
          required: source.required === true,
          type: cleanTableMessage(source.type || 'string', 'string').slice(0, 50),
        };
      }).filter(Boolean);
      if (!fields.length) return null;
      return {
        tableTitle: cleanTableMessage(schema.tableTitle || schema.title || '智能整理表', '智能整理表').slice(0, 200),
        rowDefinition: cleanTableMessage(schema.rowDefinition || schema.description || '每行代表一条独立记录', '每行代表一条独立记录').slice(0, 500),
        fields,
      };
    }

    function normalizeTablePreset(preset, index = 0) {
      if (!preset || typeof preset !== 'object' || Array.isArray(preset)) return null;
      const id = cleanTableMessage(preset.id || preset.presetId || '', '').slice(0, 100);
      const schema = normalizeTablePresetSchema(preset.schema || preset.suggestedSchema);
      if (!id || !schema) return null;
      return {
        id,
        name: cleanTableMessage(preset.name || schema.tableTitle || `预设 ${index + 1}`, `预设 ${index + 1}`).slice(0, 200),
        schema,
      };
    }

    function presetSchemaForIpc(schema = tableState.selectedPresetSchema) {
      const normalized = normalizeTablePresetSchema(schema);
      if (!normalized) return null;
      return {
        tableTitle: normalized.tableTitle,
        rowDefinition: normalized.rowDefinition,
        fields: normalized.fields.map(field => ({
          key: field.key,
          label: field.label,
          aliases: field.aliases.slice(),
          required: field.required,
          type: field.type,
        })),
      };
    }

    async function loadTablePresets(force = false) {
      if (tableState.presetsLoading || (tableState.presetsLoaded && !force)) return;
      const owner = tableState;
      const requestToken = ++tablePresetRequestSequence;
      owner.presetsLoading = true;
      owner.presetNotice = null;
      if (currentPage === 'table-workbench' && owner.stage === 'configure') renderTableWorkbench(document.getElementById('content'));
      try {
        const response = await ipcRenderer.invoke('list-table-presets', {});
        if (tableState !== owner || requestToken !== tablePresetRequestSequence) return;
        if (response?.ok === false) throw new Error(response.error || '读取本地预设失败');
        const rawPresets = response?.presets || response?.result?.presets || (Array.isArray(response?.result) ? response.result : []);
        owner.presets = (Array.isArray(rawPresets) ? rawPresets : []).slice(0, 200)
          .map((preset, index) => normalizeTablePreset(preset, index))
          .filter(Boolean);
        owner.presetsLoaded = true;
        if (owner.selectedPresetId && !owner.presets.some(preset => preset.id === owner.selectedPresetId)) {
          owner.selectedPresetId = '';
          owner.selectedPresetSchema = null;
        }
      } catch (error) {
        if (tableState !== owner || requestToken !== tablePresetRequestSequence) return;
        owner.presetNotice = { type: 'warning', text: cleanTableMessage(error, '读取本地预设失败，可继续使用临时字段。') };
      } finally {
        if (tableState === owner && requestToken === tablePresetRequestSequence) {
          owner.presetsLoading = false;
          if (currentPage === 'table-workbench' && owner.stage === 'configure') renderTableWorkbench(document.getElementById('content'));
        }
      }
    }

    async function selectTablePreset(value) {
      if (tableState.busyOperation || tableState.stage !== 'configure') return;
      const presetId = String(value || '').slice(0, 100);
      const owner = tableState;
      const requestToken = ++tablePresetRequestSequence;
      owner.presetNotice = null;
      if (!presetId) {
        owner.selectedPresetId = '';
        owner.selectedPresetSchema = null;
        owner.customFields = '';
        renderTableWorkbench(document.getElementById('content'));
        document.getElementById('tablePresetSelect')?.focus();
        return;
      }
      const preset = owner.presets.find(item => item.id === presetId);
      if (!preset) {
        owner.presetNotice = { type: 'warning', text: '所选预设已不存在，请刷新后重试。' };
        renderTableWorkbench(document.getElementById('content'));
        return;
      }
      owner.selectedPresetId = preset.id;
      owner.selectedPresetSchema = preset.schema;
      owner.customFields = preset.schema.fields.map(field => field.label).join('，');
      renderTableWorkbench(document.getElementById('content'));
      try {
        const response = await ipcRenderer.invoke('use-table-preset', { presetId: preset.id });
        if (tableState !== owner || requestToken !== tablePresetRequestSequence || owner.selectedPresetId !== preset.id) return;
        if (response?.ok === false) throw new Error(response.error || '启用本地预设失败');
        const returnedPreset = normalizeTablePreset(response?.preset || response?.result?.preset || null);
        if (returnedPreset) {
          owner.presets = owner.presets.map(item => item.id === returnedPreset.id ? returnedPreset : item);
          owner.selectedPresetSchema = returnedPreset.schema;
          owner.customFields = returnedPreset.schema.fields.map(field => field.label).join('，');
        }
        owner.presetNotice = { type: 'success', text: '已选择本地预设；仅使用字段结构，不包含任何历史文档内容。' };
      } catch (error) {
        if (tableState !== owner || requestToken !== tablePresetRequestSequence) return;
        owner.selectedPresetId = '';
        owner.selectedPresetSchema = null;
        owner.presetNotice = { type: 'warning', text: `${cleanTableMessage(error, '启用本地预设失败')}，已保留为临时预设字段。` };
      } finally {
        if (tableState === owner && currentPage === 'table-workbench' && owner.stage === 'configure') {
          renderTableWorkbench(document.getElementById('content'));
          document.getElementById('tablePresetSelect')?.focus();
        }
      }
    }

    async function deleteSelectedTablePreset() {
      if (tableState.busyOperation || tableState.stage !== 'configure' || !tableState.selectedPresetId) return;
      const preset = tableState.presets.find(item => item.id === tableState.selectedPresetId);
      if (!preset || !confirm(`确定删除本地预设“${preset.name}”吗？文档和已生成表格不会受影响。`)) return;
      const owner = tableState;
      const presetId = owner.selectedPresetId;
      const requestToken = ++tablePresetRequestSequence;
      try {
        const response = await ipcRenderer.invoke('delete-table-preset', { presetId });
        if (tableState !== owner || requestToken !== tablePresetRequestSequence) return;
        if (response?.ok === false) throw new Error(response.error || '删除本地预设失败');
        owner.presets = owner.presets.filter(item => item.id !== presetId);
        owner.selectedPresetId = '';
        owner.selectedPresetSchema = null;
        owner.customFields = '';
        owner.presetNotice = { type: 'success', text: '本地预设已删除。' };
      } catch (error) {
        if (tableState !== owner || requestToken !== tablePresetRequestSequence) return;
        owner.presetNotice = { type: 'warning', text: cleanTableMessage(error, '删除本地预设失败') };
      } finally {
        if (tableState === owner && currentPage === 'table-workbench' && owner.stage === 'configure') renderTableWorkbench(document.getElementById('content'));
      }
    }

              ${renderTableModeCard('custom', '自定义字段', '按你指定的列名从内容中组织数据', '')}

                <div class="preset-picker-controls">
                  <select id="tablePresetSelect" onchange="selectTablePreset(this.value)" ${tableState.presetsLoading ? 'disabled' : ''}>
                    <option value="" ${!tableState.selectedPresetId ? 'selected' : ''}>自动识别（可填写临时预设字段）</option>
                    ${tableState.presets.map(preset => `<option value="${escapeHtml(preset.id)}" ${preset.id === tableState.selectedPresetId ? 'selected' : ''}>${escapeHtml(preset.name)} · ${preset.schema.fields.length} 列</option>`).join('')}
                  </select>
                  ${selectedPreset ? `<button type="button" class="btn-secondary compact preset-delete" onclick="deleteSelectedTablePreset()" ${tableState.presetsLoading ? 'disabled' : ''}>${icon('trash')}删除预设</button>` : ''}
                </div>
                <div class="field-help"><span>预设只保存表名、每行定义和字段结构，不保存文档内容</span><span>${tableState.presets.length} 个</span></div>
                ${tableState.presetNotice ? `<div class="inline-preset-notice ${tableState.presetNotice.type === 'warning' ? 'warning' : 'success'}" role="status" aria-live="polite">${escapeHtml(tableState.presetNotice.text)}</div>` : ''}
              </div>
              <label for="smartPresetFields" class="field-sub-label">预设字段（可选）</label>
              <textarea id="smartPresetFields" maxlength="500" oninput="updateTableFields(this.value)" placeholder="例如：事项，负责人，截止日期，状态" ${selectedPreset ? 'disabled' : ''}>${escapeHtml(tableState.customFields)}</textarea>
              <div class="field-help"><span>${selectedPreset ? '字段来自所选本地预设；切换到“自动识别”后可编辑临时字段' : '逗号分隔，最多 30 列；完全匹配时 0 Token 本地处理，缺列或结构不清时才调用 AI'}</span><span>${fields.length}/30</span></div>
            </div>
          </section>
          <section class="card compact-card">
            <div class="setting-row">
              <div>
                <h2>${tableState.mode === 'smart' ? '预设优先，AI 按需规划' : '分析阶段允许 AI 辅助'}</h2>
                <p class="setting-desc">${tableState.mode === 'smart' ? '先在本地验证预设字段；完全匹配不调用 AI，只有缺列或结构不清时才发送受预算限制的代表片段。' : '默认关闭。开启后也只发送本地无法确定的短片段，并受设置页 Token 上限控制。'}</p>
              </div>
              <label class="toggle" title="分析阶段允许 AI 辅助">
                <input type="checkbox" ${tableState.useAi ? 'checked' : ''} ${tableState.mode === 'smart' ? 'disabled' : ''} onchange="tableState.useAi=this.checked">
                <span class="toggle-track"></span>
              </label>
            </div>
          </section>
          <div class="actions table-sticky-actions">
            <button class="btn-secondary" onclick="leaveTableWorkbench()">取消</button>
            <button class="btn" id="tableAnalyzeBtn" onclick="startTableAnalyze()"
              ${files.length === 0 || (tableState.mode === 'custom' && fields.length === 0) || (tableState.mode === 'smart' && !tableState.tableGoal.trim()) ? 'disabled' : ''}>${icon('wand')}开始分析</button>
          </div>
        </div>`;
    }

    function renderTableModeCard(mode, title, description, tag) {
      const selected = tableState.mode === mode;
      return `
        <label class="table-mode-card ${selected ? 'selected' : ''}">
          <input type="radio" name="tableMode" value="${mode}" ${selected ? 'checked' : ''} onchange="setTableMode('${mode}')">
          <span class="mode-check"></span>
          <span class="mode-copy"><strong>${title}${tag ? `<em>${tag}</em>` : ''}</strong><small>${description}</small></span>
        </label>`;
    }

    function renderTableMessages() {
      const warnings = (tableState.warnings || []).slice(0, 8);
      const errors = (tableState.errors || []).slice(0, 8);
      const notice = tableState.notice;
      return `
        ${notice ? `<div class="notice ${notice.type === 'error' ? 'error' : notice.type === 'warning' ? 'warning' : 'success'}">${icon(notice.type === 'error' ? 'alertCircle' : notice.type === 'warning' ? 'alert' : 'checkCircle')}<span>${escapeHtml(notice.text)}</span></div>` : ''}
        ${warnings.length ? `<div class="notice warning">${icon('alert')}<div class="notice__body"><strong>需要留意</strong>${warnings.map(message => `<span>${escapeHtml(message)}</span>`).join('')}</div></div>` : ''}
        ${errors.length ? `<div class="notice error">${icon('alertCircle')}<div class="notice__body"><strong>处理异常</strong>${errors.map(message => `<span>${escapeHtml(message)}</span>`).join('')}</div></div>` : ''}`;
    }

    function cleanTableMessage(value, fallback = '') {
      if (typeof value === 'string') return value.slice(0, 1000);
      if (value && typeof value === 'object') return String(value.message || value.error || value.file || fallback).slice(0, 1000);
      return String(value || fallback).slice(0, 1000);
    }

    async function maybeAutoSaveTablePreset(operationToken) {
      if (tableState.mode !== 'smart'
        || tableState.aiSkipped
        || !tableState.schemaProvider
        || tableState.errors.length
        || tableState.totalRows < 1) return;
      const schema = presetSchemaForIpc(tableState.suggestedSchema);
      if (!schema || schema.fields.length < 1 || !isTableOperationCurrent(operationToken, 'analyze', 'preview')) return;
      const name = (schema.tableTitle || tableState.tableTitle || '智能整理预设').slice(0, 200);
      try {
        const response = await ipcRenderer.invoke('save-table-preset', { name, schema });
        if (!isTableOperationCurrent(operationToken, 'analyze', 'preview')) return;
        if (response?.ok === false) throw new Error(response.error || '自动保存表格预设失败');
        const savedPreset = normalizeTablePreset(response?.preset || response?.result?.preset || (response?.id ? response : null));
        if (savedPreset) {
          const existingIndex = tableState.presets.findIndex(preset => preset.id === savedPreset.id);
          if (existingIndex >= 0) tableState.presets.splice(existingIndex, 1, savedPreset);
          else tableState.presets.unshift(savedPreset);
          tableState.presetsLoaded = true;
          tableState.selectedPresetId = savedPreset.id;
          tableState.selectedPresetSchema = savedPreset.schema;
          tableState.customFields = savedPreset.schema.fields.map(field => field.label).join('，');
        } else {
          tableState.presetsLoaded = false;
        }
        const suffix = response?.deduplicated || response?.result?.deduplicated ? '（已与同结构预设合并）' : '';
        tableState.presetSaveNotice = {
          type: 'success',
          text: `已自动保存为预设：${savedPreset?.name || name}${suffix}。仅保存表格结构，不包含文档内容。`,
        };
      } catch (error) {
        if (!isTableOperationCurrent(operationToken, 'analyze', 'preview')) return;
        tableState.presetSaveNotice = null;
        tableState.warnings.push(`表格已生成，但${cleanTableMessage(error, '自动保存预设失败')}；不会保留不完整预设。`);
      }
    }

    async function startTableAnalyze() {
      const filePaths = getTableInputFiles();
      const fields = parseTableFields();
      const goal = tableState.tableGoal.trim();
      const presetId = tableState.mode === 'smart' ? tableState.selectedPresetId : '';
      const presetSchema = presetId ? presetSchemaForIpc() : null;
      if (!filePaths.length || (tableState.mode === 'custom' && !fields.length) || (tableState.mode === 'smart' && !goal)) return;
      const operationToken = beginTableOperation('analyze');
      if (!operationToken) return;

      tableState.stage = 'analyzing';
      tableState.progress = 3;
      tableState.progressText = '正在初始化本地解析器...';
      tableState.warnings = [];
      tableState.errors = [];
      tableState.notice = null;
      tableState.presetSaveNotice = null;
      isProcessing = true;
      renderTableWorkbench(document.getElementById('content'));

      const progressListener = (event, data) => onTableProgress(event, data, operationToken);
      ipcRenderer.on('table-progress', progressListener);

      try {
        const response = await ipcRenderer.invoke('table-analyze', {
          files: filePaths,
          filePaths,
          mode: tableState.mode,
          fields,
          goal,
          useAi: tableState.useAi,
          presetId,
          presetSchema,
          options: { mode: tableState.mode, fields, goal, useAi: tableState.useAi, presetId, presetSchema },
        });
        if (!isTableOperationCurrent(operationToken, 'analyze', 'analyzing')) return;
        if (!response?.ok) throw new Error(response?.error || '文档分析失败');
        applyTableResponse(response);
        tableState.stage = 'preview';
        tableState.progress = 100;
        tableState.notice = { type: 'success', text: `分析完成：已生成 ${tableState.totalRows} 行数据。` };
        await maybeAutoSaveTablePreset(operationToken);
      } catch (error) {
        if (!isTableOperationCurrent(operationToken, 'analyze')) return;
        tableState.stage = 'configure';
        tableState.errors = [cleanTableMessage(error, '文档分析失败')];
      } finally {
        ipcRenderer.removeListener('table-progress', progressListener);
        if (finishTableOperation(operationToken, 'analyze') && currentPage === 'table-workbench') {
          renderTableWorkbench(document.getElementById('content'));
        }
      }
    }

    function onTableProgress(event, data, operationToken) {
      if (!isTableOperationCurrent(operationToken, 'analyze', 'analyzing')) return;
      const percent = Number(data?.percent ?? data?.progress ?? tableState.progress);
      if (Number.isFinite(percent)) tableState.progress = Math.min(99, Math.max(3, percent));
      tableState.progressText = cleanTableMessage(data?.step || data?.message || data?.file, tableState.progressText);
      const fill = document.getElementById('tableProgressFill');
      const label = document.getElementById('tableProgressPercent');
      const status = document.getElementById('tableProgressStatus');
      if (fill) {
        setProgressFill(fill, tableState.progress);
        fill.parentElement?.setAttribute('aria-valuenow', String(Math.round(tableState.progress)));
      }
      if (label) label.textContent = `${Math.round(tableState.progress)}%`;
      if (status) status.textContent = tableState.progressText;
    }

    async function cancelTableJob() {
      const jobId = tableState.jobId;
      invalidateTableOperation(false);
      tableState.stage = 'configure';
      tableState.notice = { type: 'warning', text: '分析已取消。' };
      if (currentPage === 'table-workbench') renderTableWorkbench(document.getElementById('content'));
      try { await ipcRenderer.invoke('table-cancel', { jobId }); } catch (_) {}
    }

    async function leaveTableWorkbench() {
      invalidateTableOperation(false);
      if (tableState.jobId) {
        try { await ipcRenderer.invoke('table-cancel', { jobId: tableState.jobId }); } catch (_) {}
      }
      tableState = createEmptyTableState();
      showPage('tasks');
    }

    function applyTableResponse(response) {
      const root = response || {};
      const payload = response?.result || response?.data || root;
      const table = payload.table || payload.preview || payload.tables?.[0] || (Array.isArray(root.rows) ? root : payload);
      const rawRows = Array.isArray(table.rows) ? table.rows : Array.isArray(table.data) ? table.data : [];
      const rawColumns = Array.isArray(table.columns)
        ? table.columns
        : Array.isArray(root.columns) && root.columns.length
          ? root.columns
          : deriveTableColumns(rawRows);
      const columns = rawColumns.slice(0, 200).map((column, index) => {
        if (typeof column === 'string') return { key: column || `column_${index + 1}`, label: column || `列 ${index + 1}` };
        const key = String(column?.key || column?.id || column?.name || column?.label || `column_${index + 1}`);
        return { key, label: String(column?.label || column?.name || key) };
      });

      tableState.jobId = response?.jobId || payload.jobId || tableState.jobId;
      tableState.columns = columns;
      const sourceMap = payload.sources && typeof payload.sources === 'object' ? payload.sources : {};
      tableState.rows = rawRows.slice(0, 10000).map((row, rowIndex) => normalizeTableRow(row, columns, rowIndex, sourceMap));
      tableState.totalRows = Number(root.totalRows ?? table.totalRows ?? payload.totalRows ?? payload.stats?.totalRows ?? rawRows.length) || rawRows.length;
      tableState.tableCount = Array.isArray(payload.tables) ? payload.tables.length : 1;
      tableState.tableTitle = cleanTableMessage(table.title || '整理结果');
      tableState.tableId = String(table.id || payload.tableId || root.tableId || '');
      const suggestedFields = root.suggestedFields ?? payload.suggestedFields ?? table.suggestedFields;
      if (Array.isArray(suggestedFields)) {
        tableState.suggestedFields = suggestedFields.slice(0, 50).map((field, index) => {
          if (typeof field === 'string') return field.slice(0, 100);
          return String(field?.label || field?.name || field?.key || `字段 ${index + 1}`).slice(0, 100);
        }).filter(Boolean);
      }
      const suggestedSchema = root.suggestedSchema ?? payload.suggestedSchema ?? table.suggestedSchema;
      if (suggestedSchema && typeof suggestedSchema === 'object' && !Array.isArray(suggestedSchema)) {
        tableState.suggestedSchema = normalizeTablePresetSchema(suggestedSchema) || {
          tableTitle: cleanTableMessage(suggestedSchema.tableTitle || suggestedSchema.title || '', ''),
          rowDefinition: cleanTableMessage(suggestedSchema.rowDefinition || suggestedSchema.description || '', ''),
          fields: [],
        };
      }
      const aiSkipped = root.aiSkipped ?? payload.aiSkipped ?? table.aiSkipped;
      if (aiSkipped !== undefined && aiSkipped !== null) {
        tableState.aiSkipped = aiSkipped === true || aiSkipped === 1 || aiSkipped === 'true';
        if (tableState.aiSkipped) tableState.presetMatchedInitially = true;
        if (!tableState.aiSkipped) tableState.aiSkipReason = '';
      }
      const aiSkipReason = root.aiSkipReason ?? payload.aiSkipReason ?? table.aiSkipReason;
      if (aiSkipReason !== undefined && aiSkipReason !== null) {
        tableState.aiSkipReason = cleanTableMessage(aiSkipReason, '');
      }
      const schemaProvider = root.schemaProvider ?? payload.schemaProvider ?? table.schemaProvider;
      if (schemaProvider !== undefined && schemaProvider !== null) {
        tableState.schemaProvider = cleanTableMessage(schemaProvider, '').slice(0, 100);
      }
      tableState.dirty = false;
      tableState.page = 1;
      tableState.warnings = (root.warnings || payload.warnings || table.warnings || []).map(value => cleanTableMessage(value)).filter(Boolean);
      tableState.errors = (root.errors || payload.errors || table.errors || []).map(value => cleanTableMessage(value)).filter(Boolean);
      tableState.stats = payload.stats || table.stats || {};
      if (rawRows.length > 10000) {
        tableState.warnings.push('预览已限制为前 10,000 行，导出仍可由后台使用完整结果。');
      }
    }

    function deriveTableColumns(rows) {
      const first = rows.find(row => row && typeof row === 'object' && !Array.isArray(row));
      const values = first?.values || first?.data || first || {};
      const metadata = new Set(['source', '_source', '__source', 'location', 'page', 'paragraph', 'needsReview', 'confidence', 'status', 'values', 'data', 'cells']);
      return Object.keys(values).filter(key => !metadata.has(key));
    }

    function normalizeTableRow(row, columns, rowIndex, sourceMap = {}) {
      const sourceObject = row && typeof row === 'object' && !Array.isArray(row) ? row : {};
      const values = Array.isArray(row)
        ? row
        : Array.isArray(sourceObject.values)
          ? sourceObject.values
          : sourceObject.values || sourceObject.data || sourceObject.cells || sourceObject;
      const cells = columns.map((column, columnIndex) => {
        const rawCell = Array.isArray(values) ? values[columnIndex] : values?.[column.key] ?? values?.[column.label];
        if (rawCell && typeof rawCell === 'object' && !Array.isArray(rawCell)) {
          return {
            value: rawCell.value ?? rawCell.text ?? '',
            needsReview: Boolean(rawCell.needsReview ?? rawCell.uncertain ?? rawCell.missing) || (Number.isFinite(Number(rawCell.confidence)) && Number(rawCell.confidence) < 0.75),
            confidence: Number(rawCell.confidence),
            source: cleanTableMessage(rawCell.source || formatTableSourceIds(rawCell.sourceIds, sourceMap).summary),
            sourceIds: Array.isArray(rawCell.sourceIds) ? rawCell.sourceIds.slice(0, 20).map(String) : [],
            edited: false,
          };
        }
        return { value: rawCell ?? '', needsReview: false, confidence: NaN, source: '', sourceIds: [], edited: false };
      });
      const resolvedSource = formatTableSourceIds(sourceObject.sourceIds, sourceMap);
      const source = cleanTableMessage(sourceObject.source || sourceObject._source || sourceObject.__source || resolvedSource.source);
      const location = cleanTableMessage(sourceObject.location || (sourceObject.page ? `第 ${sourceObject.page} 页` : '') || (sourceObject.paragraph ? `段落 ${sourceObject.paragraph}` : '') || resolvedSource.location);
      const confidence = Number(sourceObject.confidence);
      return {
        id: sourceObject.id ?? rowIndex,
        cells,
        source,
        location,
        sourceIds: Array.isArray(sourceObject.sourceIds) ? sourceObject.sourceIds.slice(0, 100).map(String) : [],
        confidence,
        needsReview: Boolean(sourceObject.needsReview ?? sourceObject.uncertain) || sourceObject.status === 'needs_review' || cells.some(cell => cell.needsReview),
        aiEnhanced: Boolean(sourceObject.aiEnhanced) || sourceObject.status === 'ai-verified',
      };
    }

    function formatTableSourceIds(sourceIds, sourceMap) {
      const sources = (Array.isArray(sourceIds) ? sourceIds : [])
        .map(sourceId => sourceMap?.[sourceId])
        .filter(source => source && typeof source === 'object');
      if (!sources.length) return { source: '', location: '', summary: '' };
      const source = sources[0];
      const sourceName = String(source.fileName || getFileName(source.file || '') || '源文档');
      const locationParts = [];
      if (source.page) locationParts.push(`第 ${source.page} 页`);
      if (source.table) locationParts.push(`表格 ${source.table}`);
      if (source.row) locationParts.push(`第 ${source.row} 行`);
      if (source.paragraph) locationParts.push(`段落 ${source.paragraph}`);
      if (source.line) locationParts.push(`第 ${source.line} 行`);
      else if (source.lineStart) locationParts.push(source.lineEnd && source.lineEnd !== source.lineStart ? `第 ${source.lineStart}–${source.lineEnd} 行` : `第 ${source.lineStart} 行`);
      const location = locationParts.join(' · ');
      return { source: sourceName, location, summary: [sourceName, location].filter(Boolean).join(' · ') };
    }

    function renderTablePreview(el) {
      const pageCount = Math.max(1, Math.ceil(tableState.rows.length / tableState.pageSize));
      tableState.page = Math.min(pageCount, Math.max(1, tableState.page));
      const start = (tableState.page - 1) * tableState.pageSize;
      const rows = tableState.rows.slice(start, start + tableState.pageSize);
      const visibleColumns = tableState.columns.slice(0, 30);
      const reviewCount = tableState.rows.filter(row => row.needsReview).length;
      const enhancedCount = tableState.rows.filter(row => row.aiEnhanced).length;
      const busyOperation = tableState.busyOperation;
      const busyLabel = busyOperation === 'enhance' ? 'AI 正在增强待确认项' : busyOperation === 'export' ? '正在生成导出文件' : '';
      const schemaTitle = tableState.suggestedSchema?.tableTitle || '';
      const rowDefinition = tableState.suggestedSchema?.rowDefinition || '';
      const aiSkipDetail = tableState.aiSkipReason === 'preset-schema-match'
        ? '本地识别的字段与预设字段完全一致，无需发送文档片段。'
        : tableState.aiSkipReason;
      const presetStayedLocal = tableState.presetMatchedInitially && !tableState.aiUsedAfterPresetMatch;

      el.innerHTML = `
        <div class="page">
          <div class="page-head table-preview-head">
            <button class="btn-secondary" onclick="resetTableAnalysis()" ${busyOperation ? 'disabled' : ''}>${icon('arrowLeft')}调整设置</button>
            <div>
              <h1>表格预览</h1>
              <p class="page-subtitle">正在预览“${escapeHtml(tableState.tableTitle || '整理结果')}”；单元格可直接编辑，黄色内容建议导出前确认。</p>
            </div>
            <div class="table-head-actions">
              <button class="btn-secondary" onclick="enhanceTableWithAi()" ${busyOperation ? 'disabled' : ''}>
                ${icon('sparkles')}${tableState.enhancing ? 'AI 正在整理…' : 'AI 增强待确认项'}
              </button>
              <button class="btn" onclick="exportTable('xlsx')" ${busyOperation ? 'disabled' : ''}>${icon('download')}导出 XLSX</button>
              <button class="btn-secondary" onclick="exportTable('csv')" ${busyOperation ? 'disabled' : ''}>导出 CSV</button>
            </div>
          </div>
          <div class="table-summary">
            <div class="stat"><strong>${tableState.totalRows}</strong><span>总行数</span></div>
            <div class="stat ${reviewCount ? 'stat--warning' : ''}"><strong>${reviewCount}</strong><span>待确认</span></div>
            <div class="stat"><strong>${enhancedCount}</strong><span>AI 已增强</span></div>
            <div class="stat"><strong>${tableState.columns.length}</strong><span>数据列</span></div>
          </div>
          ${renderTableMessages()}
          ${tableState.presetSaveNotice ? `<div class="notice success preset-save-notice" role="status" aria-live="polite">${icon('checkCircle')}<span>${escapeHtml(tableState.presetSaveNotice.text)}</span></div>` : ''}
          ${tableState.presetMatchedInitially ? `
            <div class="notice ${presetStayedLocal ? 'success' : ''} preset-match-notice" role="status" aria-live="polite">
              ${icon(presetStayedLocal ? 'checkCircle' : 'info')}
              <div class="notice__body">
                <strong>${presetStayedLocal ? '已匹配预设格式，本次未调用 AI（0 Token）' : '预设格式已在本地匹配；待确认内容随后使用了 AI'}</strong>
                ${presetStayedLocal && aiSkipDetail ? `<span>${escapeHtml(aiSkipDetail)}</span>` : !presetStayedLocal ? '<span>字段结构仍来自本地预设，AI 只处理了需要确认的内容。</span>' : ''}
                ${schemaTitle || rowDefinition ? `<small>${schemaTitle ? `表格：${escapeHtml(schemaTitle)}` : ''}${schemaTitle && rowDefinition ? ' · ' : ''}${rowDefinition ? `每行：${escapeHtml(rowDefinition)}` : ''}</small>` : ''}
                ${tableState.suggestedFields.length ? `<div class="matched-fields" aria-label="本地匹配字段">${tableState.suggestedFields.map(field => `<span>${escapeHtml(field)}</span>`).join('')}</div>` : ''}
              </div>
            </div>`
          : tableState.suggestedFields.length ? `
            <div class="suggested-fields" role="status" aria-live="polite">
              <strong>${icon('wand')}本次识别字段</strong>
              ${schemaTitle || rowDefinition ? `<small>${schemaTitle ? `表格：${escapeHtml(schemaTitle)}` : ''}${schemaTitle && rowDefinition ? ' · ' : ''}${rowDefinition ? `每行：${escapeHtml(rowDefinition)}` : ''}</small>` : ''}
              <div>${tableState.suggestedFields.map(field => `<span>${escapeHtml(field)}</span>`).join('')}</div>
              <small>字段由本次文档与整理目标动态生成，可返回调整目标后重新分析。</small>
            </div>` : ''}
          ${busyOperation ? `<div class="notice table-busy-notice" role="status" aria-live="polite">${icon('clock')}<span>${escapeHtml(busyLabel)}，完成前已锁定编辑和其他操作。</span><button class="btn-cancel compact" onclick="cancelCurrentTableOperation()">取消当前操作</button></div>` : ''}
          ${tableState.tableCount > 1 ? `<div class="notice warning">${icon('alert')}<span>本次识别出 ${tableState.tableCount} 张表。工作台预览并编辑第一张表，导出文件会同时保留其余表格。</span></div>` : ''}
          ${tableState.columns.length > visibleColumns.length ? `<div class="notice warning">${icon('alert')}<span>为保证界面流畅，预览仅显示前 ${visibleColumns.length} 列，导出包含全部 ${tableState.columns.length} 列。</span></div>` : ''}
          ${tableState.exportedPath ? `
            <div class="notice success export-result">
              ${icon('checkCircle')}<span>已导出：${escapeHtml(getFileName(tableState.exportedPath))}</span>
              <span class="row-actions">
                <button class="btn-secondary compact" onclick="openTableExport()">${icon('external')}打开</button>
                <button class="btn-secondary compact" onclick="revealTableExport()">${icon('target')}定位</button>
              </span>
            </div>` : ''}
          <div class="table-preview-card">
            ${visibleColumns.length === 0
              ? emptyState('inbox', '没有识别出可预览的数据列', '请返回调整整理方式，或检查源文档内容。')
              : `<div class="data-table-wrap">
                  <table class="data-table">
                    <thead><tr>
                      <th class="row-number" scope="col">#</th>
                      ${visibleColumns.map(column => `<th scope="col" title="${escapeHtml(column.label)}">${escapeHtml(column.label)}</th>`).join('')}
                      <th class="row-status" scope="col">状态</th>
                      <th class="row-source" scope="col">来源</th>
                    </tr></thead>
                    <tbody>
                      ${rows.length ? rows.map((row, pageIndex) => renderTableRow(row, start + pageIndex, visibleColumns.length)).join('') : `<tr><td class="empty-table" colspan="${visibleColumns.length + 3}">没有数据行</td></tr>`}
                    </tbody>
                  </table>
                </div>`}
            <div class="table-pagination">
              <span>显示 ${tableState.rows.length ? start + 1 : 0}–${Math.min(start + tableState.pageSize, tableState.rows.length)} 行，共加载 ${tableState.rows.length} 行</span>
              <div>
                <button class="btn-secondary compact" onclick="changeTablePage(-1)" ${tableState.page <= 1 || busyOperation ? 'disabled' : ''}>${icon('chevronLeft')}上一页</button>
                <span class="pagination-page">第 ${tableState.page} / ${pageCount} 页</span>
                <button class="btn-secondary compact" onclick="changeTablePage(1)" ${tableState.page >= pageCount || busyOperation ? 'disabled' : ''}>下一页${icon('chevronRight')}</button>
              </div>
            </div>
          </div>
          <div class="table-privacy-note">
            ${icon('shield')}
            <span><strong>本地优先</strong>AI 智能规划仅发送受 Token 预算限制的代表片段；后续增强只发送待确认片段。API Key 不会进入页面缓存、历史记录或日志。</span>
          </div>
        </div>`;
    }

    function renderTableRow(row, rowIndex, visibleColumnCount) {
      const source = [row.source, row.location].filter(Boolean).join(' · ') || '未提供';
      const status = row.needsReview
        ? `<span class="status-badge review">${icon('alert')}待确认</span>`
        : row.aiEnhanced
          ? `<span class="status-badge ai">${icon('sparkles')}AI 已增强</span>`
          : `<span class="status-badge ready">${icon('check')}已校验</span>`;
      return `
        <tr class="${row.needsReview ? 'needs-review' : ''}">
          <td class="row-number">${rowIndex + 1}</td>
          ${row.cells.slice(0, visibleColumnCount).map((cell, columnIndex) => `
            <td class="${cell.needsReview ? 'cell-review' : ''}">
              <input type="text" value="${escapeHtml(cell.value)}" aria-label="第 ${rowIndex + 1} 行，${escapeHtml(tableState.columns[columnIndex]?.label || `列 ${columnIndex + 1}`)}" title="${escapeHtml(cell.source || String(cell.value ?? ''))}"
                oninput="updateTableCell(${rowIndex},${columnIndex},this.value,this)" ${tableState.busyOperation ? 'disabled' : ''}>
            </td>`).join('')}
          <td class="row-status">${status}</td>
          <td class="row-source" title="${escapeHtml(source)}">${escapeHtml(source)}</td>
        </tr>`;
    }

    function updateTableCell(rowIndex, columnIndex, value, input) {
      if (tableState.busyOperation) return;
      const cell = tableState.rows?.[rowIndex]?.cells?.[columnIndex];
      if (!cell) return;
      cell.value = String(value ?? '').slice(0, 10000);
      cell.needsReview = false;
      cell.edited = true;
      const row = tableState.rows[rowIndex];
      row.needsReview = row.cells.some(item => item.needsReview);
      tableState.dirty = true;
      input?.closest('td')?.classList.remove('cell-review');
      if (!row.needsReview) {
        const tableRow = input?.closest('tr');
        tableRow?.classList.remove('needs-review');
        const statusCell = tableRow?.querySelector('.row-status');
        if (statusCell) statusCell.innerHTML = `<span class="status-badge ready">${icon('check')}已编辑</span>`;
      }
    }

    function changeTablePage(delta) {
      if (tableState.busyOperation) return;
      const pageCount = Math.max(1, Math.ceil(tableState.rows.length / tableState.pageSize));
      tableState.page = Math.min(pageCount, Math.max(1, tableState.page + delta));
      renderTablePreview(document.getElementById('content'));
      document.getElementById('content')?.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function resetTableAnalysis() {
      if (tableState.busyOperation) return;
      invalidateTableOperation(false);
      if (tableState.jobId) {
        try { await ipcRenderer.invoke('table-cancel', { jobId: tableState.jobId }); } catch (_) {}
      }
      const mode = tableState.mode;
      const customFields = tableState.customFields;
      const tableGoal = tableState.tableGoal;
      const useAi = tableState.useAi;
      const useAiBeforeSmart = tableState.useAiBeforeSmart;
      const presets = tableState.presets.slice();
      const presetsLoaded = tableState.presetsLoaded;
      const selectedPresetId = tableState.selectedPresetId;
      const selectedPresetSchema = tableState.selectedPresetSchema;
      tableState = createEmptyTableState();
      Object.assign(tableState, {
        mode,
        customFields,
        tableGoal,
        useAi,
        useAiBeforeSmart,
        presets,
        presetsLoaded,
        selectedPresetId,
        selectedPresetSchema,
      });
      renderTableWorkbench(document.getElementById('content'));
      if (mode === 'smart' && !presetsLoaded) loadTablePresets();
    }

    function serializeTableData() {
      const patches = [];
      for (let rowIndex = 0; rowIndex < tableState.rows.length; rowIndex += 1) {
        const row = tableState.rows[rowIndex];
        for (let columnIndex = 0; columnIndex < row.cells.length; columnIndex += 1) {
          const cell = row.cells[columnIndex];
          if (!cell.edited) continue;
          patches.push({
            rowId: row.id == null ? '' : String(row.id),
            rowIndex,
            columnKey: tableState.columns[columnIndex]?.key || `column_${columnIndex + 1}`,
            value: String(cell.value ?? ''),
          });
        }
      }
      return {
        tableId: tableState.tableId,
        patches,
      };
    }

    async function cancelCurrentTableOperation() {
      const operation = tableState.busyOperation;
      if (!operation || operation === 'analyze') return;
      const jobId = tableState.jobId;
      invalidateTableOperation(false);
      tableState.notice = { type: 'warning', text: operation === 'enhance' ? 'AI 增强已取消。' : '导出已取消。' };
      if (currentPage === 'table-workbench' && tableState.stage === 'preview') {
        renderTablePreview(document.getElementById('content'));
      }
      try { await ipcRenderer.invoke('table-cancel', { jobId: jobId || '' }); } catch (_) {}
    }

    async function enhanceTableWithAi() {
      if (tableState.busyOperation) return;
      const presetMatchedBeforeEnhance = tableState.presetMatchedInitially;
      const reviewIndexes = tableState.rows
        .map((row, index) => row.needsReview ? index : -1)
        .filter(index => index >= 0);
      if (!reviewIndexes.length) {
        tableState.notice = { type: 'success', text: '当前没有待确认内容，无需调用 AI。' };
        renderTablePreview(document.getElementById('content'));
        return;
      }

      const operationToken = beginTableOperation('enhance');
      if (!operationToken) return;
      tableState.enhancing = true;
      tableState.notice = { type: 'success', text: `仅提交 ${reviewIndexes.length} 行待确认片段，正在进行 AI 增强...` };
      renderTablePreview(document.getElementById('content'));
      try {
        const response = await ipcRenderer.invoke('table-ai-enhance', {
          jobId: tableState.jobId,
          fragments: 'needs-review',
          rowIndexes: reviewIndexes,
          provider: 'auto',
          tableData: serializeTableData(),
          options: { localFirst: true, fallback: true },
        });
        if (!isTableOperationCurrent(operationToken, 'enhance', 'preview')) return;
        if (!response?.ok) throw new Error(response?.error || 'AI 增强失败');
        applyTableResponse(response);
        if (presetMatchedBeforeEnhance) tableState.aiUsedAfterPresetMatch = true;
        tableState.notice = { type: 'success', text: 'AI 增强完成，请复核黄色标记和来源信息。' };
      } catch (error) {
        if (!isTableOperationCurrent(operationToken, 'enhance', 'preview')) return;
        tableState.notice = { type: 'error', text: cleanTableMessage(error, 'AI 增强失败') };
      } finally {
        if (finishTableOperation(operationToken, 'enhance') && currentPage === 'table-workbench' && tableState.stage === 'preview') {
          renderTablePreview(document.getElementById('content'));
        }
      }
    }

    async function exportTable(format) {
      if (tableState.busyOperation || !['xlsx', 'csv'].includes(format)) return;
      const operationToken = beginTableOperation('export');
      if (!operationToken) return;
      tableState.exporting = true;
      tableState.notice = { type: 'success', text: `正在生成 ${format.toUpperCase()} 文件...` };
      renderTablePreview(document.getElementById('content'));
      try {
        const response = await ipcRenderer.invoke('table-export', {
          jobId: tableState.jobId,
          format,
          tableData: serializeTableData(),
          options: { includeSource: true },
        });
        if (!isTableOperationCurrent(operationToken, 'export', 'preview')) return;
        if (!response?.ok) throw new Error(response?.error || '导出失败');
        const outputPath = response.outputPath || response.path || response.result?.outputPath || response.result?.path || response.results?.[0];
        tableState.exportedPath = outputPath || '';
        tableState.notice = { type: 'success', text: `${format.toUpperCase()} 已成功导出。` };
        if (outputPath) {
          saveHistory({ taskId: 'document-to-table', sourceFiles: selectedFiles, results: [outputPath], errors: [] });
        }
      } catch (error) {
        if (!isTableOperationCurrent(operationToken, 'export', 'preview')) return;
        tableState.notice = { type: 'error', text: cleanTableMessage(error, '导出失败') };
      } finally {

    async function runProgress() {
      const fill = document.getElementById('progressFill');
      const text = document.getElementById('progressText');
      const statusEl = document.getElementById('progressStatus');
      const cancelBtn = document.getElementById('cancelBtn');

      if (!fill || !text) return;

      ipcRenderer.on('task-progress', (event, data) => {
        if (!isProcessing) return;
        const p = data.percent || 0;
        setProgressFill(fill, p);
        text.textContent = p + '%';
        if (statusEl) {
          statusEl.textContent = data.step || data.file;
        }
      });

      setProgressFill(fill, 5);
      text.textContent = '5%';
      if (statusEl) statusEl.textContent = '正在启动转换...';

      let result = null;
      try {
        result = await ipcRenderer.invoke('process-files', selectedFiles, selectedTask);
      } catch (e) {
        console.error('Process failed:', e);
        result = { ok: false, results: [], errors: [{ file: '', error: e.message }] };
      }

      ipcRenderer.removeAllListeners('task-progress');
      isProcessing = false;

      setProgressFill(fill, 100);
      text.textContent = '100%';
      if (statusEl) statusEl.textContent = '处理完成';
      if (cancelBtn) cancelBtn.style.display = 'none';

      latestResult = {
        ...result,
        taskId: selectedTask,
        sourceFiles: [...selectedFiles],
        completedAt: Date.now(),
      };
      saveHistory(latestResult);

      await new Promise(r => setTimeout(r, 500));
      showPage('result', latestResult);
    }

    function normalizeAiSettings(raw) {
      const source = raw?.settings || raw || {};
      const providerSource = source.providers || {};
      const findProvider = (id, aliases) => {
        const value = providerSource[id] || aliases.map(alias => providerSource[alias] || source[alias]).find(Boolean) || {};
        const last4 = String(value.keyLast4 || value.last4 || value.apiKeyLast4 || '').slice(-4);
        return {
          configured: Boolean(value.configured || value.hasKey || last4),
          keyLast4: last4,
          baseUrl: String(value.baseUrl || ''),
          modelId: String(value.modelId || value.model || ''),
          lastTest: value.lastTest || value.testStatus || null,
        };
      };
      const inputTokenLimit = Number(source.inputTokenLimit ?? source.tokenLimit ?? 4000);
      const outputTokenLimit = Number(source.outputTokenLimit ?? 1200);
      const documentTokenLimit = Number(source.documentTokenLimit ?? 12000);
      const jobTokenLimit = Number(source.jobTokenLimit ?? 50000);
      return {
        enabled: Boolean(source.enabled ?? source.aiEnabled ?? false),
        encryptionAvailable: source.encryptionAvailable !== false,
        tokenLimit: Number.isFinite(inputTokenLimit) ? Math.min(8000, Math.max(512, Math.round(inputTokenLimit))) : 4000,
        inputTokenLimit: Number.isFinite(inputTokenLimit) ? Math.min(8000, Math.max(512, Math.round(inputTokenLimit))) : 4000,
        outputTokenLimit: Number.isFinite(outputTokenLimit) ? Math.min(2000, Math.max(128, Math.round(outputTokenLimit))) : 1200,
        documentTokenLimit: Number.isFinite(documentTokenLimit) ? Math.min(100000, Math.max(1000, Math.round(documentTokenLimit))) : 12000,
        jobTokenLimit: Number.isFinite(jobTokenLimit) ? Math.min(200000, Math.max(2000, Math.round(jobTokenLimit))) : 50000,
        autoFallback: Boolean(source.autoFallback ?? true),
        error: cleanTableMessage(source.error || ''),
        providers: {
          'deepseek-v3': findProvider('deepseek-v3', ['deepseek-v3-compatible', 'deepseekV3', 'v3']),
          'deepseek-v4-flash': findProvider('deepseek-v4-flash', ['deepseekV4Flash', 'v4Flash']),
        },
      };
    }

          <div class="provider-actions">
            <button class="btn" onclick="saveAiProvider('${providerId}')" ${aiSettingsCache?.encryptionAvailable === false ? 'disabled' : ''}>${provider.configured ? '覆盖保存' : '保存密钥'}</button>
            <button class="btn-secondary" onclick="testAiProvider('${providerId}')">${icon('bolt')}测试连接</button>
            <button class="btn-secondary danger" onclick="deleteAiProvider('${providerId}')" ${provider.configured ? '' : 'disabled'}>${icon('trash')}删除</button>
          </div>
        </section>`;
    }

    function getProviderForm(providerId) {
      const keyInput = document.getElementById(`${providerId}-key`);
      const baseUrlInput = document.getElementById(`${providerId}-base-url`);
      const modelIdInput = document.getElementById(`${providerId}-model-id`);
      return {
        apiKey: String(keyInput?.value || '').trim(),
        baseUrl: String(baseUrlInput?.value || '').trim(),
        modelId: String(modelIdInput?.value || '').trim(),
      };
    }

    function setProviderStatus(providerId, text, type = '') {
      const status = document.getElementById(`${providerId}-status`);
      if (!status) return;
      status.textContent = text;
      status.className = `provider-status ${type}`;
    }

    async function saveAiGeneralSettings() {
      const enabled = Boolean(document.getElementById('aiEnabledToggle')?.checked);
      const autoFallback = Boolean(document.getElementById('aiFallbackToggle')?.checked);
      const clampInput = (id, fallback, min, max) => {
        const value = Number(document.getElementById(id)?.value ?? fallback);
        return Math.min(max, Math.max(min, Number.isFinite(value) ? Math.round(value) : fallback));
      };
      const inputTokenLimit = clampInput('aiInputTokenLimit', 4000, 512, 8000);
      const outputTokenLimit = clampInput('aiOutputTokenLimit', 1200, 128, 2000);
      const documentTokenLimit = clampInput('aiDocumentTokenLimit', 12000, 1000, 100000);
      const jobTokenLimit = clampInput('aiJobTokenLimit', 50000, 2000, 200000);
      const status = document.getElementById('aiGeneralStatus');
      if (status) {
        status.textContent = '正在保存...';
        status.style.color = '#605E5C';
      }
      try {
        const result = await ipcRenderer.invoke('save-ai-provider', {
          providerId: 'general', provider: 'general', enabled, aiEnabled: enabled, autoFallback,
          inputTokenLimit, outputTokenLimit, documentTokenLimit, jobTokenLimit,
        });
        if (!result?.ok) throw new Error(result?.error || 'AI 设置保存失败');
        aiSettingsCache = normalizeAiSettings(result.settings || result || {
          ...aiSettingsCache, enabled, autoFallback, inputTokenLimit, outputTokenLimit, documentTokenLimit, jobTokenLimit,
        });
        if (status) {
          status.textContent = 'AI 设置已保存。';
          status.style.color = '#107C10';
        }
      } catch (error) {
        if (status) {
          status.textContent = cleanTableMessage(error, 'AI 设置保存失败');
          status.style.color = '#D13438';
        }
      }
    }

    async function saveAiProvider(providerId) {
      const form = getProviderForm(providerId);
      const existing = aiSettingsCache?.providers?.[providerId]?.configured;
      if (!form.apiKey && !existing) {
        setProviderStatus(providerId, '请输入 API Key。', 'error');
        return;
      }
      setProviderStatus(providerId, '正在加密保存...');
      try {
        const payload = { providerId, provider: providerId };
        if (form.apiKey) payload.apiKey = form.apiKey;
        if (providerId === 'deepseek-v3') {
          payload.baseUrl = form.baseUrl;
          payload.modelId = form.modelId;
        }
        const result = await ipcRenderer.invoke('save-ai-provider', payload);
        form.apiKey = '';
        const keyInput = document.getElementById(`${providerId}-key`);
        if (keyInput) keyInput.value = '';
        if (!result?.ok) throw new Error(result?.error || '密钥保存失败');
        setProviderStatus(providerId, '已使用 Windows 用户凭据加密保存。', 'success');
        await reloadAiSettingsView();
      } catch (error) {
        const keyInput = document.getElementById(`${providerId}-key`);
        if (keyInput) keyInput.value = '';
        setProviderStatus(providerId, cleanTableMessage(error, '密钥保存失败'), 'error');
      }
    }

    async function testAiProvider(providerId) {
      const form = getProviderForm(providerId);
      setProviderStatus(providerId, '正在测试模型连接...');
      try {
        const payload = { providerId, provider: providerId };
        if (form.apiKey) payload.apiKey = form.apiKey;
        if (providerId === 'deepseek-v3') {
          payload.baseUrl = form.baseUrl;
          payload.modelId = form.modelId;
        }
        const result = await ipcRenderer.invoke('test-ai-provider', payload);
        if (!result?.ok) throw new Error(result?.error || '连接测试失败');
        const latency = Number(result.latencyMs || result.latency);
        setProviderStatus(providerId, `连接可用${Number.isFinite(latency) ? ` · ${Math.round(latency)} ms` : ''}`, 'success');
      } catch (error) {
        setProviderStatus(providerId, cleanTableMessage(error, '连接测试失败'), 'error');
      } finally {
        const keyInput = document.getElementById(`${providerId}-key`);
        if (keyInput) keyInput.value = '';
      }
    }

    async function deleteAiProvider(providerId) {
      if (!confirm('确定删除这个模型保存的 API Key 吗？此操作无法撤销。')) return;
      setProviderStatus(providerId, '正在删除...');
      try {
        const result = await ipcRenderer.invoke('delete-ai-provider', { providerId, provider: providerId });
        if (!result?.ok) throw new Error(result?.error || '删除失败');
        await reloadAiSettingsView();
      } catch (error) {
        setProviderStatus(providerId, cleanTableMessage(error, '删除失败'), 'error');
      }
    }

    async function reloadAiSettingsView() {
      try { aiSettingsCache = normalizeAiSettings(await ipcRenderer.invoke('get-ai-settings')); } catch (_) {}
      if (currentPage === 'settings') renderSettings(document.getElementById('content'));
    }

    async function toggleLaunchAtLogin(enabled) {
      const toggle = document.getElementById('launchAtLoginToggle');
      const status = document.getElementById('launchAtLoginStatus');
      if (toggle) toggle.disabled = true;
      const result = await ipcRenderer.invoke('set-launch-at-login', enabled);
      if (toggle) {
        toggle.checked = Boolean(result.enabled);
        toggle.disabled = false;
      }
      if (status) {
        status.textContent = result.ok
          ? (result.enabled ? '已开启：下次登录 Windows 时将在后台启动。' : '已关闭开机自启动。')
          : (result.error || '开机启动设置保存失败。');
        status.style.color = result.ok ? '#107C10' : '#D13438';
      }
    }

    function setPythonStatus(state, text) {
      const el = document.getElementById('pythonStatus');
      if (!el) return;
      el.classList.remove('is-ok', 'is-error', 'is-pending');
      el.classList.add(state);
      const iconHost = el.querySelector('.settings-path__ico');
      if (iconHost) iconHost.innerHTML = icon(state === 'is-ok' ? 'checkCircle' : state === 'is-error' ? 'alertCircle' : 'clock');
      const label = document.getElementById('pythonStatusText');
      if (label) label.textContent = text;
      else el.textContent = text;
    }

    async function refreshPythonStatus() {
      setPythonStatus('is-pending', '检查中…');
      const status = await ipcRenderer.invoke('check-python-deps');
      if (status.ok) {
        setPythonStatus('is-ok', `已就绪 · ${status.command || 'python'}`);
      } else {
        setPythonStatus('is-error', `${status.error || '依赖未就绪'} · requirements.txt`);
      }
    }

    async function installPythonDeps() {
      const btn = document.getElementById('installDepsBtn');
      if (btn) btn.disabled = true;
      setPythonStatus('is-pending', '正在安装…');
      const result = await ipcRenderer.invoke('install-python-deps');
      if (result.ok) setPythonStatus('is-ok', '安装完成，正在重新检查…');
      else setPythonStatus('is-error', result.error || '安装失败');
      if (btn) btn.disabled = false;
      await refreshPythonStatus();
    }

    async function chooseOutputDir() {
      await ipcRenderer.invoke('set-output-dir');
      showPage('settings');
    }

    async function resetOutputDir() {
      await ipcRenderer.invoke('reset-output-dir');
      showPage('settings');
    }

    async function openOutputFolder() {
      await ipcRenderer.invoke('open-output-folder');
    }

    async function openResultPath(index) {
      const path = latestResult?.results?.[index];
      if (path) await ipcRenderer.invoke('open-path', path);
    }

    async function revealResultPath(index) {
      const path = latestResult?.results?.[index];
      if (path) await ipcRenderer.invoke('show-item-in-folder', path);
    }

    async function openOutputFile(index) {
      const path = outputFilesCache?.[index]?.path;
      if (path) await ipcRenderer.invoke('open-path', path);
    }

    async function revealOutputFile(index) {
      const path = outputFilesCache?.[index]?.path;
      if (path) await ipcRenderer.invoke('show-item-in-folder', path);
    }

    async function openHistoryFirst(index) {
      const path = historyCache?.[index]?.results?.[0];
      if (path) await ipcRenderer.invoke('open-path', path);
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory(document.getElementById('content'));
    }

    ipcRenderer.on('external-files-dropped', (event, files) => {
      if (!Array.isArray(files) || files.length === 0 || isProcessing || tableState.busyOperation) return;
      selectedFiles = dedupeFiles(files);
      selectedTask = null;
      showPage('tasks');
    });

    hydrateIcons();
    showPage('home');
    /* 窗口尺寸变化会改变侧栏宽度（900px 断点），指示条跟着重新对位 */
    window.addEventListener('resize', moveNavIndicator);
  </script>
</body>
</html>
